<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeBase Q&A</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg:            #0a0a0a;
      --sidebar:       #111111;
      --surface:       #18181b;
      --card:          #1f1f23;
      --elevated:      #27272a;
      --border:        #2f2f35;
      --divider:       #232329;
      --primary:       #8b5cf6;
      --primary-hover: #7c3aed;
      --primary-soft:  #a78bfa;
      --accent-blue:   #3b82f6;
      --accent-cyan:   #06b6d4;
      --text-primary:  #fafafa;
      --text-secondary:#d4d4d8;
      --text-muted:    #71717a;
      --success:       #10b981;
      --warning:       #f59e0b;
      --error:         #ef4444;
      --code-bg:       #121212;
      --user-bubble:   #2d2b55;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ══════════════════════════════════════════
       SIDEBAR
    ══════════════════════════════════════════ */
    #sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* header */
    .sb-header {
      padding: 18px 14px 14px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .logo-box {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--primary), #6d28d9);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-box svg { width: 16px; height: 16px; color: #fff; }

    .logo-text  { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.2; }
    .logo-sub   { font-size: 10px; color: var(--text-muted); font-weight: 400; }

    /* new chat */
    .new-chat-btn {
      margin: 10px 10px 0;
      padding: 8px 12px;
      width: calc(100% - 20px);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 12px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .new-chat-btn:hover {
      background: var(--elevated);
      border-color: var(--primary);
      color: var(--text-primary);
    }
    .new-chat-btn svg { width: 13px; height: 13px; }

    /* add repo */
    .add-repo-wrap {
      padding: 12px 10px 8px;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
    }

    .section-label {
      font-size: 10px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 7px;
    }

    .add-repo-row { display: flex; gap: 5px; }

    .add-repo-input {
      flex: 1; min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 11px; font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s;
    }
    .add-repo-input::placeholder { color: var(--text-muted); }
    .add-repo-input:focus { border-color: var(--primary); }

    .index-btn {
      padding: 6px 11px;
      background: var(--primary);
      border: none; border-radius: 6px;
      color: #fff;
      font-size: 11px; font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .index-btn:hover { background: var(--primary-hover); }
    .index-btn:active { transform: scale(0.95); }
    .index-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .add-status {
      margin-top: 5px;
      font-size: 10px; min-height: 14px;
      color: var(--text-muted);
    }

    /* repo list */
    .repo-list-header { padding: 10px 10px 4px; flex-shrink: 0; }

    .repo-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 6px 6px;
    }

    .repo-empty {
      padding: 16px 10px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    .repo-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
      margin-bottom: 1px;
      border: 1px solid transparent;
    }
    .repo-item:hover { background: var(--card); }
    .repo-item.active {
      background: rgba(139,92,246,.1);
      border-color: rgba(139,92,246,.22);
    }

    .repo-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-ready    { background: var(--success); }
    .dot-indexing { background: var(--warning); animation: blink-dot 1.4s ease-in-out infinite; }
    .dot-pending  { background: var(--warning); animation: blink-dot 1.4s ease-in-out infinite; }
    .dot-error    { background: var(--error); }

    @keyframes blink-dot {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    .repo-name {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }
    .repo-item.active .repo-name { color: var(--text-primary); font-weight: 500; }

    /* sidebar footer */
    .sb-footer {
      padding: 10px;
      border-top: 1px solid var(--divider);
      flex-shrink: 0;
    }

    .footer-label {
      font-size: 9px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.07em;
      margin-bottom: 4px;
    }

    .footer-id-row {
      display: flex; align-items: center; gap: 5px;
    }

    .footer-id-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--text-muted);
      flex: 1; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    .copy-btn {
      background: none; border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px;
      display: flex; align-items: center;
      border-radius: 3px;
      transition: color 0.12s, background 0.12s;
      flex-shrink: 0;
    }
    .copy-btn:hover { color: var(--text-secondary); background: var(--elevated); }
    .copy-btn svg { width: 12px; height: 12px; }

    /* ══════════════════════════════════════════
       MAIN PANEL
    ══════════════════════════════════════════ */
    #main-panel {
      flex: 1;
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
      background: var(--surface);
    }

    /* topbar */
    .topbar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
      background: var(--surface);
      flex-shrink: 0;
    }

    .topbar-name  { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .topbar-empty { font-size: 13px; color: var(--text-muted); }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px; font-weight: 500;
    }
    .badge-ready   { background: rgba(16,185,129,.1);  color: var(--success); border: 1px solid rgba(16,185,129,.2); }
    .badge-indexing{ background: rgba(245,158,11,.1);  color: var(--warning); border: 1px solid rgba(245,158,11,.2); }
    .badge-pending { background: rgba(113,113,122,.1); color: var(--text-muted); border: 1px solid rgba(113,113,122,.2); }
    .badge-error   { background: rgba(239,68,68,.1);   color: var(--error);   border: 1px solid rgba(239,68,68,.2); }

    .badge-spinner {
      width: 9px; height: 9px;
      border: 1.5px solid rgba(245,158,11,.3);
      border-top-color: var(--warning);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* chat area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* welcome */
    .welcome {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }
    .welcome-icon {
      width: 52px; height: 52px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .welcome-icon svg { width: 26px; height: 26px; color: var(--primary-soft); }
    .welcome h2 { font-size: 17px; font-weight: 600; color: var(--text-secondary); }
    .welcome p  { font-size: 12px; color: var(--text-muted); max-width: 300px; line-height: 1.65; }

    /* messages */
    .msgs {
      display: flex; flex-direction: column;
      gap: 18px;
      padding: 22px 24px;
      width: 100%; max-width: 840px;
      margin: 0 auto;
    }

    .msg { display: flex; flex-direction: column; animation: fadeUp 0.18s ease-out; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user      { align-items: flex-end; }
    .msg.assistant { align-items: flex-start; }

    .bubble {
      padding: 11px 15px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.7;
    }

    .msg.user .bubble {
      background: var(--user-bubble);
      color: var(--text-primary);
      border-radius: 12px 12px 3px 12px;
      max-width: 75%;
    }

    .msg.assistant .bubble {
      background: var(--card);
      color: var(--text-primary);
      border-radius: 12px 12px 12px 3px;
      border-left: 3px solid var(--primary);
      max-width: 92%;
      width: 100%;
    }

    /* message content markdown */
    .msg-content p        { margin-bottom: 9px; }
    .msg-content p:last-child { margin-bottom: 0; }

    .msg-content pre {
      background: var(--code-bg);
      border-radius: 8px;
      padding: 13px 15px;
      overflow-x: auto;
      margin: 10px 0;
      border: 1px solid var(--border);
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
    }
    .msg-content code { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

    .msg-content :not(pre) > code {
      background: rgba(139,92,246,.12);
      border: 1px solid rgba(139,92,246,.2);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 11px;
      color: var(--primary-soft);
    }
    .msg-content strong { font-weight: 600; }
    .msg-content ul,
    .msg-content ol { padding-left: 18px; margin-bottom: 8px; }
    .msg-content li { margin-bottom: 3px; }

    /* typing dots */
    .typing-dots {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 2px;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--primary-soft);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .18s; }
    .dot:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: .4; }
      30%          { transform: translateY(-5px); opacity: 1; }
    }

    /* cursor blink */
    .cursor {
      display: inline;
      color: var(--primary-soft);
      font-weight: 300;
      animation: cur 0.8s step-end infinite;
    }
    @keyframes cur { 0%,100%{opacity:1} 50%{opacity:0} }

    /* sources */
    .sources-wrap {
      margin-top: 10px;
      border-top: 1px solid var(--divider);
      padding-top: 8px;
    }

    .sources-toggle {
      display: inline-flex; align-items: center; gap: 4px;
      background: none; border: none;
      color: var(--text-muted);
      font-size: 11px; font-family: 'Inter', sans-serif;
      cursor: pointer;
      padding: 2px 0;
      transition: color 0.12s;
    }
    .sources-toggle:hover { color: var(--text-secondary); }
    .sources-toggle svg { width: 11px; height: 11px; transition: transform 0.18s; }
    .sources-toggle.open svg { transform: rotate(90deg); }

    .sources-list {
      margin-top: 7px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .sources-list.hidden { display: none; }

    .src-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--text-muted);
    }
    .src-chip svg { width: 9px; height: 9px; flex-shrink: 0; color: var(--primary-soft); }
    .src-chip .src-score { color: var(--text-muted); margin-left: 4px; }

    /* citations */
    .citations-wrap {
      margin-top: 12px;
    }

    .citations-header {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .citations-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .citation-card {
      background: #252525;
      border-left: 2px solid #7c3aed;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .citation-card:hover {
      background: #2a2a2a;
      border-left-color: #8b5cf6;
    }

    .citation-file {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--primary-soft);
      margin-bottom: 4px;
    }

    .citation-snippet {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--elevated);
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }

    .modal-close:hover {
      background: var(--border);
      color: var(--text-primary);
    }

    .modal-close svg {
      width: 18px;
      height: 18px;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-file {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--primary-soft);
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--divider);
    }

    .modal-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.5;
    }

    /* ─── INPUT BAR ─── */
    .input-bar {
      padding: 12px 20px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-inner {
      display: flex; align-items: flex-end; gap: 9px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 11px;
      transition: border-color 0.15s;
      max-width: 840px;
      margin: 0 auto;
    }
    .input-inner:focus-within { border-color: var(--primary); }

    .chat-ta {
      flex: 1;
      background: transparent; border: none; outline: none;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 13.5px; line-height: 1.5;
      resize: none;
      min-height: 22px; max-height: 92px;
      overflow-y: auto;
    }
    .chat-ta::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 33px; height: 33px;
      background: var(--primary);
      border: none; border-radius: 8px;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .send-btn:hover { background: var(--primary-hover); }
    .send-btn:active { transform: scale(0.90); }
    .send-btn:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 15px; height: 15px; }
  </style>
</head>
<body>

<!-- ════════════════════ SIDEBAR ════════════════════ -->
<aside id="sidebar">

  <div class="sb-header">
    <div class="logo-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">RepoMind - CodeBase Q&amp;A</div>
      <div class="logo-sub">RAG-powered search</div>
    </div>
  </div>

  <button class="new-chat-btn" onclick="newChat()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    New Chat
  </button>

  <div class="add-repo-wrap">
    <div class="section-label">Add Repository</div>
    <div class="add-repo-row">
      <input class="add-repo-input" id="repoUrlInput" type="text"
             placeholder="https://github.com/owner/repo"
             onkeydown="if(event.key==='Enter') indexRepo()">
      <button class="index-btn" id="indexBtn" onclick="indexRepo()">Index</button>
    </div>
    <div class="add-status" id="addStatus"></div>
  </div>

  <div class="repo-list-header">
    <div class="section-label">Repositories</div>
  </div>
  <div class="repo-list" id="repoList">
    <div class="repo-empty" id="repoEmpty">No repositories yet.<br>Add a GitHub URL above.</div>
  </div>

  <div class="sb-footer" id="sbFooter" style="display:none">
    <div class="footer-label">Active Repo ID</div>
    <div class="footer-id-row">
      <span class="footer-id-val" id="footerRepoId"></span>
      <button class="copy-btn" onclick="copyRepoId()" title="Copy repo ID">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
    </div>
  </div>

</aside>

<!-- ════════════════════ MAIN PANEL ════════════════════ -->
<main id="main-panel">

  <div class="topbar">
    <span id="topbarName" class="topbar-empty">Select a repository to start</span>
    <span id="topbarBadge"></span>
    <button id="reindexBtn" onclick="reindexActive()" title="Re-index repository" style="display:none;margin-left:auto;padding:4px 10px;font-size:11px;font-family:inherit;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);cursor:pointer;">↺ Re-index</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcomeScreen">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="11" y1="8" x2="11" y2="14"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </div>
      <h2>Ask anything about the codebase</h2>
      <p>Index a GitHub repository from the sidebar, select it, then start asking questions.</p>
    </div>
    <div class="msgs" id="msgsContainer" style="display:none"></div>
  </div>

  <div class="input-bar">
    <div class="input-inner">
      <textarea class="chat-ta" id="chatInput" rows="1"
                placeholder="Ask anything about the codebase..."
                onkeydown="handleKey(event)"
                oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</main>

<!-- Citation Modal -->
<div class="modal-overlay" id="citationModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeCitationModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="modal-file" id="modalFile"></div>
      <div class="modal-code" id="modalCode"></div>
    </div>
  </div>
</div>


<script>
  const API_BASE = 'http://127.0.0.1:8000';

  // ── state ──────────────────────────────────────────────
  const repos = new Map();   // id → { id, url, name, status }
  const polls = new Map();   // id → intervalId
  let activeId   = null;
  let sessionId  = null;
  let streaming  = false;

  // ── repo management ────────────────────────────────────

  function repoName(url) {
    try { return url.replace(/\.git$/, '').split('/').pop() || url; }
    catch { return url; }
  }

  async function indexRepo() {
    const input = document.getElementById('repoUrlInput');
    const url   = input.value.trim();
    const btn   = document.getElementById('indexBtn');

    if (!url)                      return setAddStatus('Enter a GitHub URL', 'error');
    if (!url.includes('github.com')) return setAddStatus('Must be a GitHub URL', 'error');

    btn.disabled = true;
    setAddStatus('Adding…', '');

    try {
      const res  = await fetch(`${API_BASE}/repos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ github_url: url })
      });
      const data = await res.json();
      if (!res.ok) return setAddStatus(data.detail || 'Failed', 'error');

      const id   = data.repo_id;
      const name = repoName(url);
      if (!repos.has(id)) {
        repos.set(id, { id, url, name, status: data.status || 'pending' });
        renderRepoList();
      }
      input.value = '';
      setAddStatus(`Added ${name}`, 'success');
      selectRepo(id);
      if (data.status !== 'ready' && data.status !== 'error') startPoll(id);
    } catch (e) {
      setAddStatus(e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  function startPoll(id) {
    if (polls.has(id)) return;
    const iv = setInterval(async () => {
      try {
        const res  = await fetch(`${API_BASE}/repos/${id}/status`);
        if (!res.ok) return;
        const data = await res.json();
        const repo = repos.get(id);
        if (!repo) return;
        repo.status = data.status;
        renderRepoList();
        if (activeId === id) renderTopbar();
        if (data.status === 'ready' || data.status === 'error') {
          clearInterval(polls.get(id));
          polls.delete(id);
        }
      } catch { }
    }, 4000);
    polls.set(id, iv);
  }

  function selectRepo(id) {
    activeId  = id;
    sessionId = null;
    clearChat();
    renderRepoList();
    renderTopbar();
    renderFooter();
  }

  function newChat() {
    sessionId = null;
    clearChat();
  }

  function clearChat() {
    const mc = document.getElementById('msgsContainer');
    mc.innerHTML = '';
    mc.style.display = 'none';
    document.getElementById('welcomeScreen').style.display = 'flex';
  }

  // ── render helpers ─────────────────────────────────────

  function renderRepoList() {
    const list  = document.getElementById('repoList');
    const empty = document.getElementById('repoEmpty');
    if (repos.size === 0) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    list.innerHTML = '';
    list.appendChild(empty);              // keep it in DOM
    empty.style.display = 'none';

    for (const [id, repo] of repos) {
      const dotClass = { ready:'dot-ready', indexing:'dot-indexing',
                         pending:'dot-pending', error:'dot-error' }[repo.status] || 'dot-pending';
      const item = document.createElement('div');
      item.className = `repo-item${activeId === id ? ' active' : ''}`;
      item.onclick   = () => selectRepo(id);
      item.innerHTML = `
        <span class="repo-dot ${dotClass}"></span>
        <span class="repo-name" title="${esc(repo.url)}">${esc(repo.name)}</span>
      `;
      list.appendChild(item);
    }
  }

  function renderTopbar() {
    const nameEl     = document.getElementById('topbarName');
    const badgeEl    = document.getElementById('topbarBadge');
    const reindexBtn = document.getElementById('reindexBtn');
    if (!activeId || !repos.has(activeId)) {
      nameEl.textContent = 'Select a repository to start';
      nameEl.className   = 'topbar-empty';
      badgeEl.innerHTML  = '';
      reindexBtn.style.display = 'none';
      return;
    }
    const repo = repos.get(activeId);
    nameEl.textContent = repo.name;
    nameEl.className   = 'topbar-name';

    const badges = {
      ready:    `<span class="badge badge-ready"><svg viewBox="0 0 10 10" width="7" height="7"><circle cx="5" cy="5" r="4" fill="currentColor"/></svg>Ready</span>`,
      indexing: `<span class="badge badge-indexing"><span class="badge-spinner"></span>Indexing…</span>`,
      pending:  `<span class="badge badge-pending"><svg viewBox="0 0 10 10" width="7" height="7"><circle cx="5" cy="5" r="4" fill="currentColor"/></svg>Pending</span>`,
      error:    `<span class="badge badge-error"><svg viewBox="0 0 10 10" width="7" height="7"><circle cx="5" cy="5" r="4" fill="currentColor"/></svg>Failed</span>`,
    };
    badgeEl.innerHTML = badges[repo.status] || badges.pending;
    reindexBtn.style.display = (repo.status === 'ready' || repo.status === 'error') ? 'inline-flex' : 'none';
  }

  async function reindexActive() {
    if (!activeId) return;
    const btn = document.getElementById('reindexBtn');
    btn.disabled = true;
    btn.textContent = '↺ Re-indexing…';
    try {
      const res = await fetch(`${API_BASE}/repos/${activeId}/reindex`, { method: 'POST' });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || 'Failed');
      const repo = repos.get(activeId);
      if (repo) { repo.status = 'pending'; renderRepoList(); renderTopbar(); }
      startPoll(activeId);
    } catch (e) {
      alert('Re-index failed: ' + e.message);
      btn.disabled = false;
      btn.textContent = '↺ Re-index';
    }
  }

  function renderFooter() {
    const footer = document.getElementById('sbFooter');
    const idEl   = document.getElementById('footerRepoId');
    if (activeId) {
      footer.style.display = 'block';
      idEl.textContent = activeId;
    } else {
      footer.style.display = 'none';
    }
  }

  function setAddStatus(msg, type) {
    const el = document.getElementById('addStatus');
    el.textContent = msg;
    el.style.color = type === 'error' ? 'var(--error)' :
                     type === 'success' ? 'var(--success)' : 'var(--text-muted)';
  }

  function copyRepoId() {
    if (!activeId) return;
    navigator.clipboard.writeText(activeId).then(() => {
      setAddStatus('Copied!', 'success');
      setTimeout(() => setAddStatus('', ''), 2000);
    });
  }

  // ── chat ───────────────────────────────────────────────

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 92) + 'px';
  }

  async function sendMessage() {
    if (streaming) return;

    const input    = document.getElementById('chatInput');
    const question = input.value.trim();
    if (!question) return;

    if (!activeId) return sysMsg('Please select a repository first.');

    const repo = repos.get(activeId);
    if (repo && repo.status !== 'ready')
      return sysMsg('Repository is still indexing — please wait.');

    input.value = '';
    input.style.height = 'auto';
    pushUserMsg(question);
    const msgEl = pushTyping();

    streaming = true;
    document.getElementById('sendBtn').disabled = true;

    try {
      const body = { repo_id: activeId, question };
      if (sessionId) body.session_id = sessionId;

      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        replaceWithError(msgEl, err.detail || 'Request failed');
        return;
      }

      await streamSSE(res, msgEl);
    } catch (e) {
      replaceWithError(msgEl, e.message);
    } finally {
      streaming = false;
      document.getElementById('sendBtn').disabled = false;
    }
  }

  async function streamSSE(res, msgEl) {
    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf       = '';
    let full      = '';
    let sources   = [];
    let citations = [];
    let first     = true;

    const bubble = msgEl.querySelector('.bubble');
    let contentEl, sourcesEl, citationsEl;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6);
        if (!raw || raw === '[DONE]') continue;

        // JSON events (metadata + answer chunks)
        if (raw.startsWith('{')) {
          try {
            const j = JSON.parse(raw);
            if (j.session_id)  { sessionId = j.session_id; continue; }
            if (j.type === 'citations') { citations = j.citations; continue; }
            if (j.type === 'sources')    { sources = j.sources;       continue; }
            if (j.sources)               { sources = j.sources;       continue; } // legacy
            if (j.type === 'answer_chunk') {
              // First real token — swap typing dots for content div
              if (first) {
                bubble.innerHTML = `<div class="msg-content"></div><div class="citations-wrap" style="display:none"></div><div class="sources-wrap" style="display:none"></div>`;
                contentEl  = bubble.querySelector('.msg-content');
                citationsEl = bubble.querySelector('.citations-wrap');
                sourcesEl  = bubble.querySelector('.sources-wrap');
                first = false;
              }
              full += j.content;
              contentEl.innerHTML = md(full) + '<span class="cursor">▋</span>';
              scrollBottom();
            }
          } catch { }
          continue;
        }

        // Legacy plain text tokens (fallback)
        if (first) {
          bubble.innerHTML = `<div class="msg-content"></div><div class="citations-wrap" style="display:none"></div><div class="sources-wrap" style="display:none"></div>`;
          contentEl  = bubble.querySelector('.msg-content');
          citationsEl = bubble.querySelector('.citations-wrap');
          sourcesEl  = bubble.querySelector('.sources-wrap');
          first = false;
        }
        full += raw;
        contentEl.innerHTML = md(full) + '<span class="cursor">▋</span>';
        scrollBottom();
      }
    }

    if (first) {
      // no tokens arrived
      bubble.innerHTML = `<div class="msg-content" style="color:var(--text-muted);font-style:italic">No response received.</div>`;
      return;
    }

    // Final render
    contentEl.innerHTML = md(full);
    bubble.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));

    // Display citations if available
    if (citations.length > 0) {
      citationsEl.style.display = 'block';
      buildCitations(citationsEl, citations);
    }

    // Display sources if available
    if (sources.length > 0) {
      sourcesEl.style.display = 'block';
      buildSources(sourcesEl, sources);
    }

    scrollBottom();
  }

  // ── message builders ───────────────────────────────────

  function showMsgs() {
    document.getElementById('welcomeScreen').style.display = 'none';
    const mc = document.getElementById('msgsContainer');
    mc.style.display = 'flex';
  }

  function pushUserMsg(text) {
    showMsgs();
    const el = document.createElement('div');
    el.className = 'msg user';
    el.innerHTML = `<div class="bubble"><div class="msg-content">${esc(text).replace(/\n/g,'<br>')}</div></div>`;
    document.getElementById('msgsContainer').appendChild(el);
    scrollBottom();
  }

  function pushTyping() {
    showMsgs();
    const el = document.createElement('div');
    el.className = 'msg assistant';
    el.innerHTML = `<div class="bubble"><div class="typing-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`;
    document.getElementById('msgsContainer').appendChild(el);
    scrollBottom();
    return el;
  }

  function replaceWithError(el, msg) {
    el.querySelector('.bubble').innerHTML =
      `<div class="msg-content" style="color:var(--error)">${esc(msg)}</div>`;
  }

  function sysMsg(text) {
    showMsgs();
    const el = document.createElement('div');
    el.className = 'msg assistant';
    el.innerHTML = `<div class="bubble"><div class="msg-content" style="color:var(--text-muted);font-style:italic">${esc(text)}</div></div>`;
    document.getElementById('msgsContainer').appendChild(el);
    scrollBottom();
  }

  function buildSources(container, sources) {
    const toggle = document.createElement('button');
    toggle.className = 'sources-toggle';
    toggle.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      ${sources.length} source${sources.length !== 1 ? 's' : ''}
    `;

    const list = document.createElement('div');
    list.className = 'sources-list hidden';

    for (const s of sources) {
      const chip = document.createElement('div');
      chip.className = 'src-chip';
      const score = typeof s.relevance_score === 'number'
        ? `<span class="src-score">${s.relevance_score.toFixed(3)}</span>` : '';
      chip.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        ${esc(s.file_path || 'unknown')}
        <span style="color:var(--text-muted)">${s.start_line}–${s.end_line}</span>
        ${score}
      `;
      list.appendChild(chip);
    }

    toggle.onclick = () => {
      const open = toggle.classList.toggle('open');
      list.classList.toggle('hidden', !open);
    };

    container.appendChild(toggle);
    container.appendChild(list);
  }

  function buildCitations(container, citations) {
    const header = document.createElement('div');
    header.className = 'citations-header';
    header.textContent = 'Citations';

    const list = document.createElement('div');
    list.className = 'citations-list';

    for (const c of citations) {
      const card = document.createElement('div');
      card.className = 'citation-card';
      card.onclick = () => openCitationModal(c);
      card.innerHTML = `
        <div class="citation-file">${esc(c.file)}:${c.line}</div>
        <div class="citation-snippet">${esc(c.snippet)}</div>
      `;
      list.appendChild(card);
    }

    container.appendChild(header);
    container.appendChild(list);
  }

  function openCitationModal(citation) {
    const overlay = document.getElementById('citationModal');
    const title = document.getElementById('modalTitle');
    const code = document.getElementById('modalCode');

    title.textContent = `${citation.file}:${citation.line}`;
    code.textContent = citation.snippet;

    overlay.classList.add('active');
  }

  function closeCitationModal() {
    const overlay = document.getElementById('citationModal');
    overlay.classList.remove('active');
  }

  function scrollBottom() {
    const ca = document.getElementById('chatArea');
    ca.scrollTop = ca.scrollHeight;
  }

  // ── markdown renderer ──────────────────────────────────

  function md(text) {
    const parts = [];
    const re    = /```(\w*)\n?([\s\S]*?)```/g;
    let last    = 0, m;

    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parts.push({ t: 'text', v: text.slice(last, m.index) });
      parts.push({ t: 'code', lang: m[1] || '', v: m[2] });
      last = m.index + m[0].length;
    }
    if (last < text.length) parts.push({ t: 'text', v: text.slice(last) });

    return parts.map(p =>
      p.t === 'code'
        ? `<pre><code class="language-${p.lang || 'plaintext'}">${esc(p.v.trimEnd())}</code></pre>`
        : mdInline(p.v)
    ).join('');
  }

  function mdInline(text) {
    return esc(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`\n]+)`/g,   '<code>$1</code>')
      .replace(/^#{3} (.+)$/gm,  '<strong style="font-size:1.03em">$1</strong>')
      .replace(/^#{2} (.+)$/gm,  '<strong style="font-size:1.07em">$1</strong>')
      .replace(/^# (.+)$/gm,     '<strong style="font-size:1.12em">$1</strong>')
      .replace(/^\s*[-*] (.+)$/gm, '&nbsp;&nbsp;• $1')
      .replace(/\n/g,            '<br>');
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
