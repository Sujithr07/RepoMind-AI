[project]
name = "repomind-ai"
version = "0.1.0"
description = "A RAG system for querying codebases using natural language"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "voyageai>=0.2",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.22",
    "tree-sitter-javascript>=0.22",
    "tree-sitter-typescript>=0.22",
    "PyGithub>=2.3",
    "gitpython>=3.1",
    "celery[redis]>=5.4",
    "redis[asyncio]>=5.0",
    "pydantic-settings>=2.3",
    "groq>=1.2.0",
    "langgraph>=1.2.0",
    "langfuse>=4.6.1",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.5.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "datasets>=4.8.5",
    "ragas>=0.4.3",
]
